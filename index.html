    --accent:#4fd1a5; --accent2:#3bbd91; --accent-soft:#17352c; --warn:#ff9478; --warn-soft:#3a211c;
    --c-ha:#6bb0f2; --c-is:#f0ad53; --c-spc:#b592ef; color-scheme: dark;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
    --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:16px 16px 48px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{font-size:1.3rem;margin:4px 0 0;font-weight:900;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  h2{font-size:.88rem;margin:0;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:.01em}
  h2 .ic{font-size:1rem;line-height:1}
  .sub{color:var(--muted);font-size:.82rem;margin:2px 0 4px;line-height:1.5}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);animation:rise .4s var(--ease) both}
  .card-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.98rem}
  .card-title .ic{font-size:1.1rem}
  label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:500}
  input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);transition:border-color .15s var(--ease), box-shadow .15s var(--ease)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
  .row label{min-width:0}
  .row input{min-width:0;width:100%}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:#fff;font-weight:700;transition:transform .12s var(--ease), box-shadow .12s var(--ease), background .15s var(--ease), opacity .12s var(--ease)}
  button:hover{background:var(--accent2)}
  button:active{transform:scale(.96)}
  button.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  button.ghost:hover{background:var(--bg)}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .icon-btn{background:var(--surface2);color:var(--ink);border:1px solid var(--line);width:36px;height:36px;padding:0;border-radius:10px;font-size:1rem}
  .row-actions{display:flex;gap:6px}
  .row-actions button{padding:6px 11px;font-size:.76rem;font-weight:600;border-radius:8px}
  .row-actions button.edit{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .row-actions button.del{background:var(--surface2);color:var(--warn);border:1px solid var(--line)}
  .row-actions button.del.confirm{background:var(--warn);color:#fff;border-color:var(--warn)}
  #msg,#xlMsg{font-size:.82rem;min-height:1.2em;color:var(--muted);transition:color .15s}
  #msg.err,#xlMsg.err{color:var(--warn);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.02em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.total td{font-weight:800;border-bottom:0}
  tr.cur{background:var(--accent-soft)}
  tr.cur td:first-child{color:var(--accent);font-weight:800}
  tr.cur td:first-child{border-radius:8px 0 0 8px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .empty{color:var(--muted);text-align:center;padding:28px 16px;font-size:.88rem;border:1.5px dashed var(--line);border-radius:14px}
  .empty .ic{display:block;font-size:1.8rem;margin-bottom:6px;opacity:.6}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600}
  .month-nav{display:flex;align-items:center;gap:10px}
  .month-nav span{font-weight:800;min-width:7em;text-align:center;font-variant-numeric:tabular-nums;font-size:1.02rem}
  .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .sum div{background:var(--surface2);border-radius:12px;padding:12px 10px;border:1px solid var(--line);transition:transform .15s var(--ease)}
  .sum small{display:block;color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.02em}
  .sum b{font-variant-numeric:tabular-nums;font-size:1.12rem;display:block;margin-top:2px}
  .chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--line)}
  .seg button{background:transparent;color:var(--muted);padding:6px 13px;font-size:.8rem;border-radius:7px;box-shadow:none}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow-sm)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:2px}
  .legend i.dash{background:none;border-top:2px dashed var(--muted);height:0}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart text{fill:var(--muted);font-size:11px}

  /* 明細卡片式列表 */
  .entries{display:flex;flex-direction:column;gap:8px}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);animation:rise .35s var(--ease) both}
  .dot{flex:none;width:10px;height:10px;border-radius:50%}
  .entry-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .entry-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .entry-item{font-weight:700;font-size:.9rem}
  .entry-date{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
  .entry-sub{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry-amt{flex:none;font-weight:800;font-variant-numeric:tabular-nums;font-size:.82rem;white-space:nowrap;text-align:right;line-height:1.5}
  .entry-actions{flex:none}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:0 auto 8px}

  @media (max-width:480px){
    body{padding:12px 12px 40px}
    .card{padding:14px;border-radius:14px}
    h1{font-size:1.15rem}
    .sum{gap:6px}
    .sum div{padding:9px 6px}
    .sum b{font-size:1rem}
    .entry-sub{max-width:40vw}
    button{padding:11px 14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
    <div>
      <h1>💰 收入表</h1>
      <p class="sub">這個頁面不經過 Claude，直接用 <span class="badge">fetch</span> 呼叫 Google Apps Script，讀寫同一份 Google 試算表。</p>
    </div>
    <button type="button" id="themeToggle" class="icon-btn" style="flex:none" aria-label="切換深色/淺色模式"></button>
  </div>

  <div class="card">
    <div class="card-title"><span class="ic">📝</span>記一筆</div>
    <label>日期<input type="date" id="date"></label>
    <label>品項
      <select id="item">
        <option>HA</option>
        <option>i Series</option>
        <option>SPC</option>
      </select>
    </label>
    <div class="row">
      <label>數量<input type="number" id="qty" min="1" value="1"></label>
      <label>購買人<input type="text" id="buyer" placeholder="姓名或公司"></label>
    </div>
    <div class="row">
      <label>獎金<input type="number" id="amount" min="0" placeholder="0"></label>
      <label>收款金額<input type="number" id="received" min="0" placeholder="0"></label>
    </div>
    <div style="display:flex;gap:8px">
      <button id="saveBtn">新增</button>
      <button id="cancelEditBtn" class="ghost" style="display:none">取消編輯</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="ic">📊</span>統計總覽</div>
    <div class="month-nav">
      <button class="icon-btn" id="prevM" aria-label="上個月">‹</button>
      <span id="monthLabel" class="num">—</span>
      <button class="icon-btn" id="nextM" aria-label="下個月">›</button>
    </div>
    <div class="sum">
      <div><small>本月獎金</small><b id="sAmt">0</b></div>
      <div><small>本月收款金額</small><b id="sRecv">0</b></div>
      <div><small>本月數量</small><b id="sQty">0</b></div>
      <div><small>本月筆數</small><b id="sCnt">0</b></div>
    </div>

    <h2><span class="ic">📅</span>週統計獎金</h2>
    <div class="tbl-wrap"><table id="weekTbl"></table></div>

    <h2><span class="ic">🗓️</span>月統計獎金（近 6 個月）</h2>
    <div class="tbl-wrap"><table id="monthTbl"></table></div>

    <div class="chart-head">
      <h2><span class="ic">📈</span>品項獎金曲線</h2>
      <div class="seg" role="group" aria-label="曲線圖時間單位">
        <button id="cWeek" aria-pressed="false">近 12 週</button>
        <button id="cMonth" aria-pressed="true">近 12 個月</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="ic">📥</span>Excel 匯出</div>
    <p class="sub" style="margin:0">匯出的檔案含「明細」「週統計」「月統計」「品項統計」四張工作表，統計表用公式連到明細，之後在 Excel 裡改明細會自動重算。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="exportBtn">匯出 Excel (.xlsx)</button>
    </div>
    <div id="xlMsg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="ic">📋</span>明細（即時從 Google 試算表讀出）</div>
    <div id="list"><div class="empty"><span class="spinner"></span>讀取中…</div></div>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// 換成你自己部署的 Apps Script 網頁應用程式網址
const API_URL = "https://script.google.com/macros/s/AKfycby24m-KIIzyja1Po_B_APBoDFQglmM0iXsLHeEn21hKpJCZsMis2lPvfPLxsX3ePnNR5g/exec";
const ITEMS = [
  { k: "HA", c: "var(--c-ha)" },
  { k: "i Series", c: "var(--c-is)" },
  { k: "SPC", c: "var(--c-spc)" }
];

const $ = (id) => document.getElementById(id);

/* ---------- 深色/淺色模式 ---------- */
const THEME_KEY = "income-webapp-theme";
function effectiveTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") return saved;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") {
    document.documentElement.setAttribute("data-theme", saved);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  $("themeToggle").textContent = effectiveTheme() === "dark" ? "☀️" : "🌙";
}
$("themeToggle").addEventListener("click", () => {
  localStorage.setItem(THEME_KEY, effectiveTheme() === "dark" ? "light" : "dark");
  applyTheme();
});
applyTheme();

const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const weekStart = (s) => { const d = parseDate(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const md = (s) => Number(s.slice(5, 7)) + "/" + Number(s.slice(8));
const fmt = (n) => Math.round(Number(n) || 0).toLocaleString("zh-TW");
const sum = (rs, f = "獎金") => rs.reduce((s, r) => s + (Number(r[f]) || 0), 0);

const state = { rows: [], month: today().slice(0, 7), chartUnit: "month", editId: null };

$("date").value = today();

function setMsg(text, isErr) {
  $("msg").textContent = text;
  $("msg").className = isErr ? "err" : "";
}
function setXlMsg(text, isErr) {
  $("xlMsg").textContent = text;
  $("xlMsg").className = isErr ? "err" : "";
}

function itemColor(k) {
  const it = ITEMS.find(i => i.k === k);
  return it ? it.c : "var(--muted)";
}

async function loadList() {
  try {
    const res = await fetch(API_URL, { method: "GET" });
    const rows = await res.json();
    state.rows = (rows || []).filter(r => r && r.日期 && typeof r.獎金 !== "undefined");
    render();
  } catch (err) {
    $("list").innerHTML = '<div class="empty"><span class="ic">⚠️</span>讀取失敗，請確認網路連線或稍後再試。</div>';
  }
}

function render() {
  renderList();
  renderStats();
}

function renderList() {
  const box = $("list");
  if (!state.rows.length) {
    box.innerHTML = '<div class="empty"><span class="ic">🧾</span>目前還沒有紀錄，記一筆看看吧。</div>';
    return;
  }
  const sorted = state.rows
    .map((r, i) => ({ r, i }))
    .sort((a, b) => String(b.r.日期).localeCompare(String(a.r.日期)) || (b.i - a.i))
    .map(x => x.r);
  let html = '<div class="entries">';
  for (const r of sorted) {
    html += `<div class="entry" style="animation-delay:${Math.min(sorted.indexOf(r), 10) * 25}ms">
      <span class="dot" style="background:${itemColor(r.品項)}"></span>
      <div class="entry-main">
        <div class="entry-top"><span class="entry-item">${esc(r.品項)}</span><span class="entry-date">${md(r.日期)}</span></div>
        <div class="entry-sub">${esc(r.購買人)} · ${esc(r.數量)} 件</div>
      </div>
      <div class="entry-amt">獎金 ${fmt(r.獎金)}<br>收款 ${fmt(r.收款金額)}</div>
      <div class="entry-actions row-actions">
        <button class="edit" data-edit="${esc(r.ID)}">編輯</button>
        <button class="del" data-del="${esc(r.ID)}">刪除</button>
      </div>
    </div>`;
  }
  html += "</div>";
  box.innerHTML = html;

  box.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => startEdit(btn.dataset.edit));
  });
  box.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => handleDeleteClick(btn));
  });
}

function startEdit(id) {
  const r = state.rows.find(x => String(x.ID) === String(id));
  if (!r) return;
  state.editId = id;
  $("date").value = r.日期;
  $("item").value = r.品項;
  $("qty").value = r.數量;
  $("buyer").value = r.購買人;
  $("amount").value = r.獎金;
  $("received").value = r.收款金額;
  $("saveBtn").textContent = "更新";
  $("cancelEditBtn").style.display = "";
  setMsg("編輯中：改完按「更新」送出，或按「取消編輯」放棄。");
  $("saveBtn").scrollIntoView({ behavior: "smooth", block: "center" });
}

function cancelEdit() {
  state.editId = null;
  $("date").value = today();
  $("item").selectedIndex = 0;
  $("qty").value = 1;
  $("buyer").value = "";
  $("amount").value = "";
  $("received").value = "";
  $("saveBtn").textContent = "新增";
  $("cancelEditBtn").style.display = "none";
  setMsg("");
}
$("cancelEditBtn").addEventListener("click", cancelEdit);

async function handleDeleteClick(btn) {
  if (!btn.classList.contains("confirm")) {
    box_resetConfirm();
    btn.classList.add("confirm");
    btn.textContent = "確定刪除？";
    return;
  }
  const id = btn.dataset.del;
  btn.disabled = true;
  btn.textContent = "刪除中…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", id })
    });
    const data = await res.json();
    if (data.status === "ok") {
      if (state.editId === id) cancelEdit();
      loadList();
    } else {
      setMsg("刪除失敗：" + (data.message || "未知錯誤"), true);
      btn.disabled = false;
      btn.textContent = "刪除";
      btn.classList.remove("confirm");
    }
  } catch (err) {
    setMsg("連線失敗，請稍後再試。", true);
    btn.disabled = false;
    btn.textContent = "刪除";
    btn.classList.remove("confirm");
  }
}
function box_resetConfirm() {
  $("list").querySelectorAll("button.del.confirm").forEach(b => { b.classList.remove("confirm"); b.textContent = "刪除"; });
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function headRow(tbl, cols) { const tr = el("tr"); for (const c of cols) tr.appendChild(el("th", c.num ? "num" : null, c.label)); tbl.appendChild(tr); }
function dataRow(tbl, cells, cls) { const tr = el("tr", cls); cells.forEach((c, i) => tr.appendChild(el("td", i ? "num" : null, c))); tbl.appendChild(tr); }

function shiftMonth(k) {
  const [y, m] = state.month.split("-").map(Number);
  const d = new Date(y, m - 1 + k, 1);
  state.month = d.getFullYear() + "-" + pad(d.getMonth() + 1);
  renderStats();
}
$("prevM").addEventListener("click", () => shiftMonth(-1));
$("nextM").addEventListener("click", () => shiftMonth(1));
$("cWeek").addEventListener("click", () => { state.chartUnit = "week"; renderChart(); });
$("cMonth").addEventListener("click", () => { state.chartUnit = "month"; renderChart(); });

  function renderStats() {
  const [y, m] = state.month.split("-");
  $("monthLabel").textContent = y + " 年 " + Number(m) + " 月";
  const mine = state.rows.filter(r => r.日期.startsWith(state.month));

  $("sAmt").textContent = fmt(sum(mine));
  $("sRecv").textContent = fmt(sum(mine, "收款金額"));
  $("sQty").textContent = fmt(sum(mine, "數量"));
  $("sCnt").textContent = mine.length;

  const cols = ["", ...ITEMS.map(i => i.k), "合計"];

  // 週統計
  const wt = $("weekTbl"); wt.textContent = "";
  headRow(wt, [{ label: "週（一～日）" }, ...ITEMS.map(() => ({ label: "", num: true })).map((_, i) => ({ label: ITEMS[i].k, num: true })), { label: "合計", num: true }]);
  const first = state.month + "-01";
  const lastD = new Date(Number(y), Number(m), 0);
  const last = ymd(lastD);
  const curW = weekStart(today());
  for (let w = weekStart(first); w <= last; w = addDays(w, 7)) {
    const e = addDays(w, 6);
    const rs = state.rows.filter(r => r.日期 >= w && r.日期 <= e);
    dataRow(wt, [md(w) + "–" + md(e), ...ITEMS.map(it => fmt(sum(rs.filter(r => r.品項 === it.k)))), fmt(sum(rs))], w === curW ? "cur" : null);
  }

  // 月統計（近 6 個月）
  const mt = $("monthTbl"); mt.textContent = "";
  headRow(mt, [{ label: "月份" }, ...ITEMS.map(it => ({ label: it.k, num: true })), { label: "合計", num: true }]);
  const [yy, mm] = state.month.split("-").map(Number);
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(yy, mm - 1 - i, 1); months.push(d.getFullYear() + "-" + pad(d.getMonth() + 1)); }
  for (const mo of months) {
    const rs = state.rows.filter(r => r.日期.startsWith(mo));
    dataRow(mt, [mo.replace("-", "/"), ...ITEMS.map(it => fmt(sum(rs.filter(r => r.品項 === it.k)))), fmt(sum(rs))], mo === state.month ? "cur" : null);
  }
  const six = state.rows.filter(r => r.日期 >= months[0] + "-01" && r.日期 <= last);
  dataRow(mt, ["6 個月合計", ...ITEMS.map(it => fmt(sum(six.filter(r => r.品項 === it.k)))), fmt(sum(six))], "total");

  renderChart();
}

function renderChart() {
  $("cWeek").setAttribute("aria-pressed", String(state.chartUnit === "week"));
  $("cMonth").setAttribute("aria-pressed", String(state.chartUnit === "month"));
  const lg = $("legend"); lg.textContent = "";
  for (const it of ITEMS) { const s = el("span"); const i = el("i"); i.style.background = it.c; s.append(i, it.k); lg.appendChild(s); }
  const st = el("span"); const di = el("i", "dash"); st.append(di, "合計"); lg.appendChild(st);

  const [yy, mm] = state.month.split("-").map(Number);
  const B = [];
  if (state.chartUnit === "month") {
    for (let i = 11; i >= 0; i--) { const d = new Date(yy, mm - 1 - i, 1); const k = d.getFullYear() + "-" + pad(d.getMonth() + 1); B.push({ label: (d.getMonth() + 1) + "月", test: r => r.日期.startsWith(k) }); }
  } else {
    const endRef = state.month === today().slice(0, 7) ? today() : ymd(new Date(yy, mm, 0));
    let w = addDays(weekStart(endRef), -77);
    for (let i = 0; i < 12; i++) { const s = w, e = addDays(w, 6); B.push({ label: md(s), test: r => r.日期 >= s && r.日期 <= e }); w = addDays(w, 7); }
  }
  const series = ITEMS.map(it => ({ it, vals: B.map(b => sum(state.rows.filter(r => r.品項 === it.k && b.test(r)))) }));
  const totals = B.map((b, i) => series.reduce((s, se) => s + se.vals[i], 0));

  const W = 680, H = 240, L = 58, R = 14, T = 14, Bt = 30;
  const pw = W - L - R, ph = H - T - Bt;
  const raw = Math.max(1, ...totals);
  const step = niceStep(raw / 4);
  const top = Math.ceil(raw / step) * step;
  const x = (i) => L + (B.length === 1 ? pw / 2 : i * pw / (B.length - 1));
  const y = (v) => T + ph - (v / top * ph);

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "各品項獎金曲線圖");
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };

  for (let v = 0; v <= top + 1e-9; v += step) {
    mk("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 });
    const t = mk("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" });
    t.textContent = short(v);
  }
  const every = B.length > 8 ? 2 : 1;
  B.forEach((b, i) => {
    if (i % every && i !== B.length - 1) return;
    const t = mk("text", { x: x(i), y: H - 10, "text-anchor": "middle" });
    t.textContent = b.label;
  });
  const path = (vals) => vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  mk("path", { d: path(totals), fill: "none", stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "4 4" });
  for (const se of series) {
    mk("path", { d: path(se.vals), fill: "none", stroke: se.it.c, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
    se.vals.forEach((v, i) => {
      const isLast = i === se.vals.length - 1;
      const c = mk("circle", { cx: x(i), cy: y(v), r: isLast ? 4.5 : 3, fill: isLast ? se.it.c : "var(--surface)", stroke: se.it.c, "stroke-width": 2 });
      const tt = document.createElementNS(NS, "title");
      tt.textContent = se.it.k + "　" + B[i].label + "：NT$" + fmt(v);
      c.appendChild(tt);
    });
  }
  const box = $("chart"); box.textContent = ""; box.appendChild(svg);
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function short(v) { return v >= 1e4 ? (v / 1e4).toLocaleString("zh-TW", { maximumFractionDigits: 1 }) + "萬" : fmt(v); }

/* ---------- Excel 匯出 ---------- */
const serial = (s) => { const [y, m, d] = s.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
const N = "#,##0";
function buildWorkbook() {
  const XL = window.XLSX, wb = XL.utils.book_new();
  const rows = [...state.rows].sort((a, b) => a.日期.localeCompare(b.日期));

  // 明細
  const ws = XL.utils.aoa_to_sheet([["日期", "品項", "數量", "購買人", "獎金", "收款金額", "週起始日", "月份"]]);
  rows.forEach((r, i) => {
    const R = i + 1;
    ws[XL.utils.encode_cell({ r: R, c: 0 })] = { t: "n", v: serial(r.日期), z: "yyyy-mm-dd" };
    ws[XL.utils.encode_cell({ r: R, c: 1 })] = { t: "s", v: r.品項 || "" };
    ws[XL.utils.encode_cell({ r: R, c: 2 })] = { t: "n", v: Number(r.數量) || 0 };
    ws[XL.utils.encode_cell({ r: R, c: 3 })] = { t: "s", v: r.購買人 || "" };
    ws[XL.utils.encode_cell({ r: R, c: 4 })] = { t: "n", v: Number(r.獎金) || 0, z: N };
    ws[XL.utils.encode_cell({ r: R, c: 5 })] = { t: "n", v: Number(r.收款金額) || 0, z: N };
    ws[XL.utils.encode_cell({ r: R, c: 6 })] = { t: "n", v: serial(weekStart(r.日期)), f: "A" + (R + 1) + "-WEEKDAY(A" + (R + 1) + ",3)", z: "yyyy-mm-dd" };
    ws[XL.utils.encode_cell({ r: R, c: 7 })] = { t: "s", v: r.日期.slice(0, 7), f: 'TEXT(A' + (R + 1) + ',"yyyy-mm")' };
  });
  ws["!ref"] = "A1:H" + (rows.length + 1);
  ws["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 7 }, { wch: 18 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 9 }];
  if (rows.length) ws["!autofilter"] = { ref: ws["!ref"] };
  XL.utils.book_append_sheet(wb, ws, "明細");

  const itemCols = ["C", "D", "E"];

  // 週統計
  const weeks = [...new Set(rows.map(r => weekStart(r.日期)))].sort();
  const wk = XL.utils.aoa_to_sheet([["週起始日", "週結束日", ...ITEMS.map(i => i.k), "合計"]]);
  weeks.forEach((w, i) => {
    const R = i + 2;
    const rs = rows.filter(r => weekStart(r.日期) === w);
    wk["A" + R] = { t: "n", v: serial(w), z: "yyyy-mm-dd" };
    wk["B" + R] = { t: "n", v: serial(w) + 6, f: "A" + R + "+6", z: "yyyy-mm-dd" };
    ITEMS.forEach((it, j) => {
      wk[itemCols[j] + R] = { t: "n", v: sum(rs.filter(r => r.品項 === it.k)), f: 'SUMIFS(明細!$E:$E,明細!$G:$G,$A' + R + ',明細!$B:$B,' + itemCols[j] + '$1)', z: N };
    });
    wk["F" + R] = { t: "n", v: sum(rs), f: "SUM(C" + R + ":E" + R + ")", z: N };
  });
  totalRow(wk, weeks.length, ["C", "D", "E", "F"], "A");
  wk["!ref"] = "A1:F" + (weeks.length + 2);
  wk["!cols"] = [{ wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XL.utils.book_append_sheet(wb, wk, "週統計");

  // 月統計
  const months = [...new Set(rows.map(r => r.日期.slice(0, 7)))].sort();
  const mCols = ["B", "C", "D"];
  const mo = XL.utils.aoa_to_sheet([["月份", ...ITEMS.map(i => i.k), "合計", "數量合計"]]);
  months.forEach((m, i) => {
    const R = i + 2;
    const rs = rows.filter(r => r.日期.startsWith(m));
    mo["A" + R] = { t: "s", v: m };
    ITEMS.forEach((it, j) => {
      mo[mCols[j] + R] = { t: "n", v: sum(rs.filter(r => r.品項 === it.k)), f: 'SUMIFS(明細!$E:$E,明細!$H:$H,$A' + R + ',明細!$B:$B,' + mCols[j] + '$1)', z: N };
    });
    mo["E" + R] = { t: "n", v: sum(rs), f: "SUM(B" + R + ":D" + R + ")", z: N };
    mo["F" + R] = { t: "n", v: sum(rs, "數量"), f: "SUMIFS(明細!$C:$C,明細!$H:$H,$A" + R + ")" };
  });
  totalRow(mo, months.length, ["B", "C", "D", "E", "F"], "A");
  mo["!ref"] = "A1:F" + (months.length + 2);
  mo["!cols"] = [{ wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }];
  XL.utils.book_append_sheet(wb, mo, "月統計");

  // 品項統計
  const it = XL.utils.aoa_to_sheet([["品項", "數量合計", "獎金合計", "獎金佔比", "筆數"]]);
  const all = sum(rows) || 1;
  ITEMS.forEach((x, i) => {
    const R = i + 2;
    const rs = rows.filter(r => r.品項 === x.k);
    it["A" + R] = { t: "s", v: x.k };
    it["B" + R] = { t: "n", v: sum(rs, "數量"), f: "SUMIFS(明細!$C:$C,明細!$B:$B,$A" + R + ")" };
    it["C" + R] = { t: "n", v: sum(rs), f: "SUMIFS(明細!$E:$E,明細!$B:$B,$A" + R + ")", z: N };
    it["D" + R] = { t: "n", v: sum(rs) / all, f: "IF($C$5=0,0,C" + R + "/$C$5)", z: "0.0%" };
    it["E" + R] = { t: "n", v: rs.length, f: "COUNTIFS(明細!$B:$B,$A" + R + ")" };
  });
  it["A5"] = { t: "s", v: "合計" };
  it["B5"] = { t: "n", v: sum(rows, "數量"), f: "SUM(B2:B4)" };
  it["C5"] = { t: "n", v: sum(rows), f: "SUM(C2:C4)", z: N };
  it["D5"] = { t: "n", v: rows.length ? 1 : 0, f: "SUM(D2:D4)", z: "0.0%" };
  it["E5"] = { t: "n", v: rows.length, f: "SUM(E2:E4)" };
  it["!ref"] = "A1:E5";
  it["!cols"] = [{ wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 7 }];
  XL.utils.book_append_sheet(wb, it, "品項統計");

  return { wb, count: rows.length };
}
function totalRow(ws, n, cols, labelCol) {
  const R = n + 2; if (!n) return;
  ws[labelCol + R] = { t: "s", v: "合計" };
  for (const c of cols) {
    let v = 0; for (let r = 2; r < R; r++) v += ws[c + r]?.v || 0;
    ws[c + R] = { t: "n", v, f: "SUM(" + c + "2:" + c + (R - 1) + ")", z: N };
  }
}
$("exportBtn").addEventListener("click", () => {
  if (!window.XLSX) return setXlMsg("Excel 元件沒有載入，請重新整理頁面", true);
  if (!state.rows.length) return setXlMsg("還沒有可匯出的紀錄", true);
  const { wb, count } = buildWorkbook();
  XLSX.writeFile(wb, "收入表_" + today() + ".xlsx");
  setXlMsg("已匯出 " + count + " 筆");
});

  /* ---------- 記一筆 ---------- */
$("saveBtn").addEventListener("click", async () => {
  const date = $("date").value;
  const item = $("item").value;
  const qty = Number($("qty").value);
  const buyer = $("buyer").value.trim();
  const amount = Number($("amount").value);
  const received = Number($("received").value) || 0;

  if (!date) return setMsg("請選擇日期", true);
  if (!(qty > 0)) return setMsg("數量要大於 0", true);
  if (!buyer) return setMsg("請填寫購買人", true);
  if (!(amount > 0)) return setMsg("請輸入獎金", true);
  if (received < 0) return setMsg("收款金額不能是負數", true);

  $("saveBtn").disabled = true;
  const editing = !!state.editId;
  setMsg(editing ? "更新中…" : "送出中…");
  try {
    const payload = editing
      ? { action: "update", id: state.editId, date, item, qty, buyer, bonus: amount, received }
      : { action: "add", date, item, qty, buyer, bonus: amount, received };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.status === "ok") {
      if (editing) {
        setMsg("已更新！");
        cancelEdit();
      } else {
        setMsg("已新增！");
        $("buyer").value = "";
        $("amount").value = "";
        $("received").value = "";
      }
      loadList();
    } else {
      setMsg((editing ? "更新失敗：" : "儲存失敗：") + (data.message || "未知錯誤"), true);
    }
  } catch (err) {
    setMsg("連線失敗，請稍後再試。", true);
  } finally {
    $("saveBtn").disabled = false;
  }
});

loadList();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
